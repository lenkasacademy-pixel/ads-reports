<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mana Hospitals — Meta Ads Report</title>
<style>
/* ============================================================
   EDIT ME: leave BRAND empty for no branding, or put a name /
   line of text here and it appears quietly in the footer.
   ============================================================ */
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0B0B0E; --card:#141418; --card-2:#1B1B21; --raise:#22222A;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --ink:#F6F6F8; --ink-2:#A6A6B2; --ink-3:#71717F;
  --grid:#26262E; --axis:#33333D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-ink:#3ad13a; --warn-ink:#fab219; --crit-ink:#ff6b6b;
  --glow:0 0 0 1px rgba(255,255,255,.05), 0 1px 2px rgba(0,0,0,.5), 0 12px 32px -12px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  color-scheme:light;
  --canvas:#F6F6F4; --card:#FFFFFF; --card-2:#FAFAF8; --raise:#F0F0EC;
  --line:rgba(11,11,11,.10); --line-2:rgba(11,11,11,.16);
  --ink:#0B0B0E; --ink-2:#55555F; --ink-3:#8A8A94;
  --grid:#E7E7E1; --axis:#C9C9C1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-ink:#006300; --warn-ink:#8a5c00; --crit-ink:#c0392b;
  --glow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -14px rgba(0,0,0,.28);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.5;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:1120px;margin:0 auto;padding:0 20px 80px}
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--canvas) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{max-width:1120px;margin:0 auto;padding:14px 20px;display:flex;gap:14px;align-items:center;
  justify-content:space-between;flex-wrap:wrap}
.brand h1{font-size:16px;font-weight:650;margin:0;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--ink-3)}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;visibility:hidden}
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:500;
  padding:6px 15px;border-radius:999px;cursor:pointer;transition:.15s}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);font-weight:650}
.dbox{display:flex;align-items:center;gap:8px;background:var(--card-2);border:1px solid var(--line);
  border-radius:999px;padding:5px 8px 5px 14px}
.dbox label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.dbox input[type=date]{background:transparent;border:0;color:var(--ink);font:inherit;font-size:13px;
  font-weight:600;border-radius:6px;cursor:pointer;color-scheme:inherit;min-width:118px}
.dbox .arrow{color:var(--ink-3);font-size:12px}
.rngnote{font-size:12px;color:var(--ink-3);white-space:nowrap}
.rngnote b{color:var(--ink-2);font-weight:650}
.warnmsg{font-size:12px;color:var(--crit-ink);font-weight:600}
.ghost{border:1px solid var(--line);background:var(--card-2);color:var(--ink-2);border-radius:999px;
  width:38px;height:34px;font-size:15px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.ghost:hover{color:var(--ink);border-color:var(--line-2)}
.hero{padding:30px 0 24px}
.hero .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.hero h2{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.08}
.hero .lede{font-size:16.5px;color:var(--ink-2);max-width:76ch;margin:0;line-height:1.6}
.hero .lede b{color:var(--ink);font-weight:650}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;
  border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--card-2);white-space:nowrap}
.chip .cd{width:6px;height:6px;border-radius:50%}
.chip.good{color:var(--good-ink)} .chip.good .cd{background:var(--good)}
.chip.mut{color:var(--ink-3)} .chip.mut .cd{background:var(--ink-3)}
.chip.warn{color:var(--warn-ink)} .chip.warn .cd{background:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px 13px;
  box-shadow:var(--glow);display:flex;flex-direction:column;overflow:hidden}
.stat .sl{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase;margin-bottom:9px}
.stat .sv{font-size:33px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.stat .sv.sm{font-size:26px}
.stat .ss{font-size:13px;color:var(--ink-2);margin-top:8px}
.stat .spark{margin-top:auto;padding-top:14px;height:34px}
.sechd{display:flex;align-items:baseline;gap:10px;margin:34px 0 12px;flex-wrap:wrap}
.sechd h3{font-size:18px;font-weight:650;letter-spacing:-.018em;margin:0}
.sechd span{font-size:13px;color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--glow)}
.card > h4{margin:0 0 3px;font-size:14.5px;font-weight:650}
.card > .sub{margin:0 0 14px;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:12px}
.mswitch{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.mswitch button{border:1px solid var(--line);background:var(--card-2);color:var(--ink-2);font:inherit;
  font-size:12.5px;font-weight:550;padding:5px 12px;border-radius:999px;cursor:pointer;transition:.15s}
.mswitch button[aria-pressed="true"]{background:var(--raise);color:var(--ink);border-color:var(--line-2);font-weight:650}
svg.chart{display:block;width:100%;overflow:visible}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mcell{background:var(--card);padding:13px 14px}
.mcell .ml{font-size:11px;text-transform:uppercase;letter-spacing:.045em;color:var(--ink-3);margin-bottom:6px}
.mcell .mv{font-size:19px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mcell .ms{font-size:11.5px;color:var(--ink-2);margin-top:4px;line-height:1.4}
.na{color:var(--ink-3)} .per{font-weight:400;font-size:13px;color:var(--ink-3)}
.approx{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--warn-ink);
  border:1px solid var(--line-2);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.045em;
  cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card-2);z-index:2}
th:hover{color:var(--ink)} th[data-dir]::after{content:'↓';margin-left:5px;color:var(--s1)}
th[data-dir="asc"]::after{content:'↑'}
th.l,td.l{text-align:left}
td.l{max-width:320px;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:normal}
td .nm{font-weight:550} td .sb{color:var(--ink-3);font-size:11px;margin-top:3px}
tbody tr:hover{background:var(--card-2)} tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:650;background:var(--card-2);border-top:1px solid var(--line-2);border-bottom:0}
details.dz{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;
  box-shadow:var(--glow);overflow:hidden}
details.dz > summary{cursor:pointer;list-style:none;padding:15px 18px;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;gap:10px;color:var(--ink);user-select:none}
details.dz > summary::-webkit-details-marker{display:none}
details.dz > summary:hover{background:var(--card-2)}
details.dz > summary .cv{margin-left:auto;color:var(--ink-3);font-size:12.5px;font-weight:450}
details.dz > summary .ch{transition:transform .2s;color:var(--ink-3);font-size:11px}
details.dz[open] > summary .ch{transform:rotate(90deg)}
details.dz .dzbody{padding:16px 18px 18px;border-top:1px solid var(--line)}
.tt{position:fixed;pointer-events:none;z-index:80;background:var(--raise);color:var(--ink);
  border:1px solid var(--line-2);border-radius:11px;padding:10px 12px;font-size:12.5px;
  box-shadow:0 10px 34px rgba(0,0,0,.5);opacity:0;transition:opacity .1s;max-width:300px}
.tt.on{opacity:1}
.tt .td{color:var(--ink-3);font-size:11px;margin-bottom:6px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tt .tr{display:flex;justify-content:space-between;gap:18px;font-variant-numeric:tabular-nums;line-height:1.7}
.tt .tr span{color:var(--ink-2)} .tt .tr b{font-weight:650}
.ctrls{visibility:hidden}
.loadmsg{padding:80px 20px;text-align:center;color:var(--ink-2)}
.loadmsg h2{font-size:20px;color:var(--ink);margin:0 0 10px;letter-spacing:-.02em}
.loadmsg p{margin:0 auto 10px;max-width:58ch;font-size:14.5px;line-height:1.65}
.loadmsg .hint{font-size:13px;color:var(--ink-3)}
.loadmsg code{background:var(--card-2);padding:1px 5px;border-radius:4px;font-size:12.5px}
.spin{width:26px;height:26px;margin:0 auto 16px;border-radius:50%;
  border:2.5px solid var(--line-2);border-top-color:var(--s1);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--ink-3);
  font-size:12.5px;line-height:1.75}
.foot b{color:var(--ink-2)}
@media (max-width:640px){ .hero h2{font-size:25px} .hero .lede{font-size:15px} .stat .sv{font-size:27px}
  .shell{padding:0 13px 56px} .topin{padding:12px 13px} }
</style>
</head>
<body>
<div class="topbar"><div class="topin">
  <div class="brand"><h1 id="btitle"></h1><small id="bsub"></small></div>
  <div class="ctrls">
    <div class="seg" role="group" aria-label="Quick ranges">
      <button data-preset="7">7d</button><button data-preset="14">14d</button>
      <button data-preset="30" aria-pressed="true">30d</button>
    </div>
    <div class="dbox"><label for="dfrom">From</label><input type="date" id="dfrom">
      <span class="arrow">&rarr;</span><label for="dto">To</label><input type="date" id="dto"></div>
    <span class="rngnote" id="rngnote"></span>
    <button class="ghost" id="theme" title="Switch theme">&#9728;</button>
  </div>
</div></div>
<div class="shell"><div id="app"></div><div class="foot" id="foot"></div></div>
<div class="tt" id="tt"></div>
<script>
const nf=new Intl.NumberFormat('en-IN');
const money=v=>'₹'+nf.format(Math.round(v));
const money2=v=>'₹'+Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>nf.format(Math.round(v));
const pct=v=>Number(v).toFixed(2)+'%';
const dec=(v,n=2)=>Number(v).toFixed(n);
const compact=v=>v>=1e7?(v/1e7).toFixed(2)+' Cr':v>=1e5?(v/1e5).toFixed(2)+' L'
  :v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':nf.format(Math.round(v));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dL=s=>{const p=s.split('-');return (+p[2])+' '+MON[+p[1]-1];};
const dLY=s=>dL(s)+' '+s.slice(0,4);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mid=(s,n=40)=>s.length<=n?s:s.slice(0,Math.ceil(n/2)-1)+'…'+s.slice(-Math.floor(n/2)+2);
const DAY=86400000;
const addDays=(d,n)=>new Date(Date.parse(d)+n*DAY).toISOString().slice(0,10);
const span=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/DAY)+1;
let C=null, FROM=null, TO=null, CH={}, TCFG=null;

/* ---------- slicing ---------- */
function sliceAll(){
  const rows=C.daily.filter(r=>r.d>=FROM&&r.d<=TO);
  const s=rows.reduce((a,r)=>({spend:a.spend+r.spend,imp:a.imp+r.imp,clicks:a.clicks+r.clicks,
    reachSum:a.reachSum+r.reach,lpv:a.lpv+r.lpv,regs:a.regs+(r.regs||0),
    eng:a.eng+(r.eng||0),thru:a.thru+(r.thru||0),outb:a.outb+(r.outb||0)}),
    {spend:0,imp:0,clicks:0,reachSum:0,lpv:0,regs:0,eng:0,thru:0,outb:0});
  const tr=(C.trueReach||{})[FROM+'|'+TO];
  s.reach=tr!=null?tr:s.reachSum; s.reachExact=tr!=null;
  s.freq=s.reach?s.imp/s.reach:0; s.cpm=s.imp?s.spend/s.imp*1000:0;
  s.cpc=s.clicks?s.spend/s.clicks:0; s.ctr=s.imp?s.clicks/s.imp*100:0;
  s.cpp=s.reach?s.spend/s.reach*1000:0; s.cpReg=s.regs?s.spend/s.regs:0;
  s.rows=rows; s.days=span(FROM,TO); s.activeDays=rows.filter(r=>r.spend>0).length;

  const m=new Map();
  C.campDaily.forEach(r=>{ if(r.d<FROM||r.d>TO)return;
    let e=m.get(r.name);
    if(!e){const mt=C.campMeta[r.name]||{};
      e={name:r.name,st:mt.st||'',dlv:mt.dlv||'',resType:mt.resType||C.resShort,
         spend:0,imp:0,clicks:0,res:0,lpv:0,leads:0,regs:0};m.set(r.name,e);}
    e.spend+=r.spend;e.imp+=r.imp;e.clicks+=r.clicks;
    e.res+=r.res||0;e.lpv+=r.lpv||0;e.leads+=r.leads||0;e.regs+=r.regs||0;});
  const camps=[...m.values()].filter(e=>e.spend>0);
  camps.forEach(e=>{e.cpm=e.imp?e.spend/e.imp*1000:0;e.cpc=e.clicks?e.spend/e.clicks:0;
    e.ctr=e.imp?e.clicks/e.imp*100:0;e.cpr=e.res?e.spend/e.res:0;e.cpReg=e.regs?e.spend/e.regs:0;});
  camps.sort((a,b)=>b.spend-a.spend);

  const prim=camps.filter(x=>x.resType!=='Website leads'), lead=camps.filter(x=>x.resType==='Website leads');
  s.res=prim.reduce((a,x)=>a+x.res,0);
  s.cpr=s.res?prim.reduce((a,x)=>a+x.spend,0)/s.res:0;
  const ln=lead.reduce((a,x)=>a+x.leads,0);
  s.leads=ln; s.cpl=ln?lead.reduce((a,x)=>a+x.spend,0)/ln:0;
  s.instToReg=s.res?s.regs/s.res*100:0;
  return {s,camps};
}

/* ---------- tooltip ---------- */
const tt=document.getElementById('tt');
function showTT(h,x,y){tt.innerHTML=h;tt.classList.add('on');
  const r=tt.getBoundingClientRect();let l=x+16,t=y-r.height-14;
  if(l+r.width>innerWidth-10)l=x-r.width-16; if(l<10)l=10; if(t<10)t=y+20;
  tt.style.left=l+'px';tt.style.top=t+'px';}
const hideTT=()=>tt.classList.remove('on');

/* ---------- charts ---------- */
function smooth(p){ if(p.length<3) return 'M'+p.map(x=>x.join(',')).join(' L');
  let d='M'+p[0][0]+','+p[0][1];
  for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;
    d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)},${(b[1]+(c[1]-a[1])/6).toFixed(1)} `
      +`${(c[0]-(e[0]-b[0])/6).toFixed(1)},${(c[1]-(e[1]-b[1])/6).toFixed(1)} `
      +`${c[0].toFixed(1)},${c[1].toFixed(1)}`;} return d;}
let SPK=0;
function sparkline(vals,color){ const W=200,H=34,n=vals.length; if(!n)return '';
  const mx=Math.max(...vals,0)||1;
  const pts=n===1?[[0,H-2],[W,H-2-(vals[0]/mx)*(H-6)]]:vals.map((v,i)=>[i*(W/(n-1)),H-2-(v/mx)*(H-6)]);
  const id='k'+(++SPK);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:34px">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".30"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs><path d="${smooth(pts)} L${W},${H} L0,${H} Z" fill="url(#${id})"/>
    <path d="${smooth(pts)}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"
      stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
let GID=0;
function bigLine(o){
  const W=980,H=300,ml=64,mr=20,mt=18,mb=34,n=o.rows.length;
  if(!n)return `<p style="color:var(--ink-3);padding:40px 0;text-align:center">No delivery in this date range.</p>`;
  const mx=(Math.max(...o.rows.map(r=>r[o.key]||0),0)||1)*1.14;
  const X=i=>ml+(n<2?(W-ml-mr)/2:i*(W-ml-mr)/(n-1)), Y=v=>mt+(H-mt-mb)*(1-v/mx);
  let g='';[0,.25,.5,.75,1].forEach(t=>{const v=mx*t;
    g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)"/>`
     +`<text x="${ml-12}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11.5" fill="var(--ink-3)">${o.ax(v)}</text>`;});
  const pts=o.rows.map((r,i)=>[X(i),Y(r[o.key]||0)]), path=smooth(pts), gid='g'+(++GID);
  const idx=n<=6?o.rows.map((_,i)=>i):[0,Math.floor((n-1)/3),Math.floor(2*(n-1)/3),n-1];
  let xl='';[...new Set(idx)].forEach(i=>{
    xl+=`<text x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}"
      font-size="11.5" fill="var(--ink-3)">${dL(o.rows[i].d)}</text>`;});
  const dots=n<=10?o.rows.map((r,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(r[o.key]||0).toFixed(1)}" r="4"
    fill="${o.c}" stroke="var(--card)" stroke-width="2"/>`).join(''):'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" data-chart="t" style="aspect-ratio:${W}/${H}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${o.c}" stop-opacity=".26"/><stop offset="1" stop-color="${o.c}" stop-opacity="0"/>
    </linearGradient></defs>${g}
    <path d="${path} L${X(n-1).toFixed(1)},${Y(0).toFixed(1)} L${X(0).toFixed(1)},${Y(0).toFixed(1)} Z" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="${o.c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}<line x1="${ml}" x2="${W-mr}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--axis)"/>
    ${xl}<g class="hov"></g><rect x="${ml}" y="0" width="${W-ml-mr}" height="${H}" fill="transparent" class="hit"
      data-n="${n}" data-ml="${ml}" data-mr="${mr}" data-w="${W}"/></svg>`;}
function bars(o){
  const it=o.items.filter(d=>d.value>0);
  if(!it.length)return `<p style="color:var(--ink-3);font-size:13px;margin:14px 0">Nothing in this date range.</p>`;
  const mx=Math.max(...it.map(d=>d.value)),rowH=38,W=420,H=it.length*rowH;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  it.forEach((d,i)=>{const y=i*rowH,bw=Math.max(3,(d.value/mx)*(W*.50));
    s+=`<g><text x="0" y="${y+12}" font-size="11.5" fill="var(--ink-2)">${esc(mid(d.name))}</text>
      ${d.extra?`<text x="${W}" y="${y+12}" text-anchor="end" font-size="11" fill="var(--ink-3)">${esc(d.extra)}</text>`:''}
      <rect x="0" y="${y+19}" width="${W}" height="10" rx="5" fill="var(--grid)" opacity=".55"/>
      <rect x="0" y="${y+19}" width="${bw.toFixed(1)}" height="10" rx="5" fill="${o.c}"/>
      <text x="${(bw+10).toFixed(1)}" y="${y+28}" font-size="12" font-weight="650" fill="var(--ink)">${o.fmt(d.value)}</text></g>`;});
  return s+'</svg>';}
function funnel(steps){
  const it=steps.filter(s=>s.v>0); if(it.length<2)return '';
  const mx=it[0].v,rowH=54,W=420,H=it.length*rowH;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  it.forEach((d,i)=>{const y=i*rowH,bw=Math.max(4,(d.v/mx)*(W*.58));
    const base=i===0?null:(i===1?it[0]:it[1]);
    const cv=base?(d.v/base.v*100):null, bl=i===1?'of impressions':'of clicks';
    s+=`<g><text x="0" y="${y+13}" font-size="12" fill="var(--ink-2)">${esc(d.k)}</text>
      ${cv!==null?`<text x="${W}" y="${y+13}" text-anchor="end" font-size="11" fill="var(--ink-3)">${cv<0.01?cv.toFixed(4):cv.toFixed(2)}% ${bl}</text>`:''}
      <rect x="0" y="${y+21}" width="${W}" height="14" rx="7" fill="var(--grid)" opacity=".55"/>
      <rect x="0" y="${y+21}" width="${bw.toFixed(1)}" height="14" rx="7" fill="${d.c}"/>
      <text x="${(bw+11).toFixed(1)}" y="${y+32}" font-size="13" font-weight="700" fill="var(--ink)">${num(d.v)}</text></g>`;});
  return s+'</svg>';}

/* ---------- bits ---------- */
const statCard=o=>`<div class="stat"><div class="sl">${esc(o.label)}</div>
  <div class="sv${o.sm?' sm':''}">${o.value}</div>${o.sub?`<div class="ss">${o.sub}</div>`:''}
  ${o.spark?`<div class="spark">${o.spark}</div>`:''}</div>`;
const mcell=(l,v,s)=>`<div class="mcell"><div class="ml">${esc(l)}</div><div class="mv">${v}</div>
  ${s?`<div class="ms">${s}</div>`:''}</div>`;
const approx=ok=>ok?'':'<span class="approx" title="Meta counts each person once, so reach cannot be added up day by day. For custom ranges this is the daily total and slightly overstates unique people.">APPROX</span>';
function table(cols,rows,tot){
  let h='<div class="tw"><table><thead><tr>';
  cols.forEach((c,i)=>h+=`<th class="${c.l?'l':''}" data-si="${i}" data-num="${c.l?0:1}">${esc(c.h)}</th>`);
  h+='</tr></thead><tbody>';
  if(!rows.length)h+=`<tr><td class="l" colspan="${cols.length}" style="color:var(--ink-3)">No delivery in this date range.</td></tr>`;
  rows.forEach(r=>{h+='<tr>';cols.forEach(c=>h+=`<td class="${c.l?'l':''}" data-v="${c.raw?esc(String(c.raw(r))):''}">${c.f(r)}</td>`);h+='</tr>';});
  h+='</tbody>';
  if(tot&&rows.length){h+='<tfoot><tr>';cols.forEach(c=>h+=`<td class="${c.l?'l':''}">${c.t?c.t(tot):''}</td>`);h+='</tr></tfoot>';}
  return h+'</table></div>';}
const liveChip=(st,dlv)=>String(dlv||'').toLowerCase()==='active'
  ? `<span class="chip good"><span class="cd"></span>running</span>`
  : `<span class="chip mut"><span class="cd"></span>paused</span>`;
const rangeTxt=()=>`${dL(FROM)} – ${dLY(TO)}`;

/* ---------- render ---------- */
function render(){
  const {s:k,camps}=sliceAll(), days=k.days, rows=k.rows;
  const running=camps.some(x=>String(x.dlv).toLowerCase()==='active');
  let h='';

  let lede;
  if(k.spend<=0){
    lede=`No ads ran between <b>${dL(FROM)}</b> and <b>${dLY(TO)}</b>. Widen the date range above to see activity.`;
  } else if(!k.res){
    lede=`Between <b>${dL(FROM)}</b> and <b>${dLY(TO)}</b> your ads spent <b>${money(k.spend)}</b>, were shown
      <b>${num(k.imp)}</b> times and earned <b>${num(k.clicks)}</b> clicks at a <b>${pct(k.ctr)}</b> click-through rate.`;
  } else {
    const leadbit=k.leads?`, plus <b>${num(k.leads)}</b> website leads at <b>${money2(k.cpl)}</b> each`:'';
    const regbit=C.hasRegs&&k.regs?` Of those, <b>${num(k.regs)}</b> (<b>${dec(k.instToReg,1)}%</b>) went on to
      complete sign-up, at <b>${money2(k.cpReg)}</b> per registration.`:'';
    lede=`Between <b>${dL(FROM)}</b> and <b>${dLY(TO)}</b> your ads spent <b>${money(k.spend)}</b> and delivered
      <b>${num(k.res)}</b> ${esc(C.resLabelLower)} at <b>${money2(k.cpr)}</b> each${leadbit}.${regbit}`;
  }
  h+=`<div class="hero"><div class="row1"><h2>${esc(C.name)}</h2>
    ${running?`<span class="chip good"><span class="cd"></span>ads running</span>`
             :`<span class="chip mut"><span class="cd"></span>ads paused</span>`}</div>
    <p class="lede">${lede}</p></div>`;

  const st=[];
  st.push(statCard({label:'Amount spent',value:money(k.spend),
    sub:money(k.spend/days)+' a day · '+rangeTxt(),spark:sparkline(rows.map(r=>r.spend),'var(--s1)')}));
  st.push(statCard({label:C.resLabel,value:num(k.res),
    sub:dec(k.res/days,1)+' a day on average',
    spark:rows.some(r=>r.res>0)?sparkline(rows.map(r=>r.res),'var(--s2)'):''}));
  st.push(statCard({label:'Cost per '+C.resUnit,value:k.cpr?money2(k.cpr):'—',sm:true,sub:'lower is better'}));
  st.push(statCard({label:'Click-through rate',value:pct(k.ctr),sub:num(k.clicks)+' clicks in total',
    spark:sparkline(rows.map(r=>r.ctr),'var(--s3)')}));
  if(C.hasRegs) st.push(statCard({label:'Sign-ups',value:num(k.regs),
    sub:(k.cpReg?money2(k.cpReg):'—')+' each · '+dec(k.instToReg,1)+'% of installs',
    spark:sparkline(rows.map(r=>r.regs||0),'var(--s3)')}));
  h+=`<div class="stats">${st.join('')}</div>`;

  const metrics=[
    {k:'spend',n:'Spend',c:'var(--s1)',ax:v=>'₹'+compact(v),f:money2},
    {k:'imp',n:'Times shown',c:'var(--s1)',ax:compact,f:num},
    {k:'clicks',n:'Clicks',c:'var(--s3)',ax:compact,f:num},
    {k:'ctr',n:'Click-through rate',c:'var(--s3)',ax:v=>Number(v).toFixed(1)+'%',f:pct},
    {k:'cpc',n:'Cost per click',c:'var(--s2)',ax:v=>'₹'+Number(v).toFixed(v<10?1:0),f:money2},
    {k:'cpm',n:'Cost per 1,000 views',c:'var(--s2)',ax:v=>'₹'+compact(v),f:money2},
  ];
  if(rows.some(r=>r.res>0)) metrics.push({k:'res',n:C.resLabel,c:'var(--s2)',ax:compact,f:num});
  if(rows.some(r=>r.lpv>0)) metrics.push({k:'lpv',n:'Landing page views',c:'var(--s3)',ax:compact,f:num});
  if(C.hasRegs&&rows.some(r=>r.regs>0)) metrics.push({k:'regs',n:'Sign-ups',c:'var(--s3)',ax:compact,f:num});
  TCFG={rows,metrics};
  h+=`<div class="sechd"><h3>Day by day</h3><span>${rangeTxt()} · ${days} days · choose what to plot</span></div>
    <div class="card"><div class="mswitch" id="msw">${metrics.map((m,i)=>
      `<button data-mi="${i}" aria-pressed="${i===0}">${esc(m.n)}</button>`).join('')}</div>
      <div id="trend"></div></div>`;

  const fs=[{k:'Times shown',v:k.imp,c:'var(--s1)'},{k:'Clicks',v:k.clicks,c:'var(--s1)'}];
  if(k.lpv)fs.push({k:'Landing page views',v:k.lpv,c:'var(--s3)'});
  if(k.res)fs.push({k:C.resLabel,v:k.res,c:'var(--s2)'});
  if(C.hasRegs&&k.regs)fs.push({k:'Sign-ups',v:k.regs,c:'var(--s3)'});
  h+=`<div class="sechd"><h3>Where the budget went</h3><span>${rangeTxt()}</span></div><div class="grid2">
    <div class="card"><h4>From views to results</h4><p class="sub">Each step shown as a share of the step above it</p>
      ${funnel(fs)||'<p style="color:var(--ink-3);font-size:13px">Not enough activity in this range.</p>'}</div>
    <div class="card"><h4>Spend by campaign</h4><p class="sub">${camps.length} campaign${camps.length===1?'':'s'} ran in this period</p>
      ${bars({items:camps.map(x=>({name:x.name,value:x.spend,extra:k.spend?pct(x.spend/k.spend*100):''})),fmt:money,c:'var(--s1)'})}</div>
    <div class="card"><h4>Cost per result by campaign</h4><p class="sub">Lower is better</p>
      ${bars({items:camps.filter(x=>x.res>0).map(x=>({name:x.name,value:x.cpr,
        extra:num(x.res)+' '+x.resType.toLowerCase()})),fmt:money2,c:'var(--s2)'})}</div>
    <div class="card"><h4>Cost per 1,000 views by campaign</h4><p class="sub">What each campaign paid to be seen</p>
      ${bars({items:camps.map(x=>({name:x.name,value:x.cpm,extra:'CTR '+pct(x.ctr)})),fmt:money2,c:'var(--s3)'})}</div>
  </div>`;

  const mg=[
    mcell('Times shown',compact(k.imp),'How often your ads appeared on a screen'),
    mcell('People reached',compact(k.reach)+approx(k.reachExact),
      k.reachExact?'Separate people who saw your ads':'Daily total — slightly overstates unique people'),
    mcell('Times seen per person',dec(k.freq)+approx(k.reachExact),'On average'),
    mcell('Cost per 1,000 views',money2(k.cpm),'Standard industry measure'),
    mcell('Cost per click',money2(k.cpc),'Across clicks of every kind'),
    mcell('Cost to reach 1,000 people',money2(k.cpp)+approx(k.reachExact),''),
    mcell('Landing page views',k.lpv?num(k.lpv):'<span class="na">—</span>',
      k.lpv?money2(k.spend/k.lpv)+' each':'Not applicable to these campaigns'),
    mcell('Website leads',k.leads?num(k.leads):'<span class="na">—</span>',
      k.leads?money2(k.cpl)+' each':'Not applicable to these campaigns'),
    mcell('Likes, comments & shares',compact(k.eng),k.imp?dec(k.eng/k.imp*100,1)+'% of times shown':''),
    mcell('Video plays to completion',k.thru?compact(k.thru):'<span class="na">—</span>','Watched fully, or 15 seconds'),
    mcell('Clicks away to your site',k.outb?num(k.outb):'<span class="na">—</span>',''),
    mcell('Days ads ran',`${k.activeDays}<span class="per"> of ${days}</span>`,''),
  ];
  h+=`<div class="sechd"><h3>Everything else</h3><span>${rangeTxt()}</span></div>`;
  h+=`<details class="dz"><summary><span class="ch">▶</span>All measurements
    <span class="cv">${mg.length} figures</span></summary><div class="dzbody">
    <div class="mgrid">${mg.join('')}</div></div></details>`;

  const cols=[
    {h:'Campaign',l:1,f:r=>`<div class="nm">${esc(r.name)}</div><div class="sb">${liveChip(r.st,r.dlv)}</div>`,
      raw:r=>r.name,t:()=>`${camps.length} campaign${camps.length===1?'':'s'}`},
    {h:'Spend',f:r=>money2(r.spend),raw:r=>r.spend,t:t=>money2(t.spend)},
    {h:'Times shown',f:r=>num(r.imp),raw:r=>r.imp,t:t=>num(t.imp)},
    {h:'Clicks',f:r=>num(r.clicks),raw:r=>r.clicks,t:t=>num(t.clicks)},
    {h:'CTR',f:r=>r.ctr?pct(r.ctr):'—',raw:r=>r.ctr,t:t=>t.imp?pct(t.clicks/t.imp*100):'—'},
    {h:'Cost / click',f:r=>r.cpc?money2(r.cpc):'—',raw:r=>r.cpc,t:t=>t.clicks?money2(t.spend/t.clicks):'—'},
    {h:'Cost / 1,000 views',f:r=>r.cpm?money2(r.cpm):'—',raw:r=>r.cpm,t:t=>t.imp?money2(t.spend/t.imp*1000):'—'},
    {h:'Landing page views',f:r=>r.lpv?num(r.lpv):'—',raw:r=>r.lpv,t:t=>t.lpv?num(t.lpv):'—'},
    {h:'Results',f:r=>r.res?`<div class="nm">${num(r.res)}</div><div class="sb">${esc(r.resType)}</div>`:'—',
      raw:r=>r.res,t:t=>num(t.res)},
    {h:'Cost / result',f:r=>r.cpr?money2(r.cpr):'—',raw:r=>r.cpr},
    ...(C.hasRegs?[{h:'Sign-ups',f:r=>r.regs?num(r.regs):'—',raw:r=>r.regs,t:t=>num(t.regs)},
      {h:'Cost / sign-up',f:r=>r.cpReg?money2(r.cpReg):'—',raw:r=>r.cpReg}]:[]),
  ];
  const tot=camps.reduce((a,r)=>({spend:a.spend+r.spend,imp:a.imp+r.imp,clicks:a.clicks+r.clicks,
    lpv:a.lpv+r.lpv,res:a.res+r.res,regs:a.regs+r.regs}),{spend:0,imp:0,clicks:0,lpv:0,res:0,regs:0});
  h+=`<div class="sechd"><h3>Campaign breakdown</h3><span>${rangeTxt()} · tap a column heading to sort</span></div>
    <div class="card" style="padding:0;overflow:hidden">${table(cols,camps,tot)}</div>`;

  document.getElementById('app').innerHTML=h;
  document.getElementById('btitle').textContent=C.name;
  const gen=C.generated?` · updated ${dLY(C.generated)}`:'';
  document.getElementById('bsub').textContent=`Meta Ads report · figures through ${dLY(C.maxDate)}${gen}`;
  document.getElementById('foot').innerHTML=
   `<b>About these figures</b> — reported by Meta for advertising account activity between ${dLY(C.minDate)} and
    ${dLY(C.maxDate)}. All amounts in Indian Rupees. Meta does not report the current day until it is complete, so the
    most recent full day shown is ${dLY(C.maxDate)}.<br>
    <b>Results</b> means the outcome each campaign was set up to achieve — ${esc(C.resLabelLower)} here. Cost per result
    divides only the spend of the campaigns chasing that outcome, not total account spend.<br>
    <b>People reached</b> counts each person once, so it cannot be added up across days. Figures marked
    <span class="approx">APPROX</span> are daily totals for a custom date range and slightly overstate unique people;
    the full 30-day and last-7-day views show Meta's exact figure.${C.footNote?'<br>'+C.footNote:''}`;
  drawTrend(0); wire();
}
function drawTrend(mi){
  const m=TCFG.metrics[mi]||TCFG.metrics[0];
  CH.t={rows:TCFG.rows,key:m.k,fmt:m.f,label:m.n};
  const el=document.getElementById('trend'); if(!el)return;
  el.innerHTML=bigLine({rows:TCFG.rows,key:m.k,c:m.c,ax:m.ax}); wireCharts();
}
function wireCharts(){
  document.querySelectorAll('svg[data-chart]').forEach(svg=>{
    if(svg.dataset.wired)return; svg.dataset.wired='1';
    const cfg=CH[svg.dataset.chart]; if(!cfg)return;
    const hit=svg.querySelector('.hit'),hov=svg.querySelector('.hov'); if(!hit)return;
    const n=+hit.dataset.n,ml=+hit.dataset.ml,mr=+hit.dataset.mr,W=+hit.dataset.w;
    const mv=e=>{const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
      const px=(e.clientX-r.left)/r.width*vb.width;
      let i=n<2?0:Math.round((px-ml)/((W-ml-mr)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const xx=n<2?ml+(W-ml-mr)/2:ml+i*(W-ml-mr)/(n-1), row=cfg.rows[i];
      hov.innerHTML=`<line x1="${xx.toFixed(1)}" x2="${xx.toFixed(1)}" y1="14" y2="${vb.height-30}"
        stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="4 4"/>`;
      showTT(`<div class="td">${dLY(row.d)}</div><div class="tr"><span>${esc(cfg.label)}</span>
        <b>${cfg.fmt(row[cfg.key]||0)}</b></div>`,e.clientX,e.clientY);};
    hit.addEventListener('mousemove',mv);
    hit.addEventListener('mouseleave',()=>{hov.innerHTML='';hideTT();});
    hit.addEventListener('touchmove',ev=>{ev.preventDefault();mv(ev.touches[0]);},{passive:false});});
}
function wire(){
  const sw=document.getElementById('msw');
  if(sw) sw.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    sw.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    drawTrend(+b.dataset.mi);});
  document.querySelectorAll('table th').forEach(th=>th.onclick=()=>{
    const tb=th.closest('table'),i=+th.dataset.si,isN=th.dataset.num==='1';
    const dir=th.dataset.dir==='asc'?'desc':'asc';
    tb.querySelectorAll('th').forEach(x=>x.removeAttribute('data-dir'));
    th.dataset.dir=dir;
    const body=tb.tBodies[0];
    [...body.rows].sort((a,b)=>{let av=a.cells[i].dataset.v,bv=b.cells[i].dataset.v;
      if(isN){av=parseFloat(av)||0;bv=parseFloat(bv)||0;return dir==='asc'?av-bv:bv-av;}
      return dir==='asc'?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));})
      .forEach(r=>body.appendChild(r));});
  wireCharts();
}
/* ---------- date range ---------- */
const eF=document.getElementById('dfrom'),eT=document.getElementById('dto'),eN=document.getElementById('rngnote');
function syncControls(){
  eF.value=FROM; eT.value=TO; const d=span(FROM,TO);
  document.querySelectorAll('.seg button[data-preset]').forEach(b=>
    b.setAttribute('aria-pressed', TO===C.maxDate && d===+b.dataset.preset));
  eN.innerHTML=`<b>${d}</b> day${d===1?'':'s'} · ${dL(FROM)} – ${dLY(TO)}`;
}
function setRange(f,t,quiet){
  if(f>t){const x=f;f=t;t=x;}
  if(f<C.minDate)f=C.minDate; if(t>C.maxDate)t=C.maxDate;
  if(span(f,t)>C.maxSpan){ f=addDays(t,-(C.maxSpan-1));
    if(!quiet){eN.innerHTML=`<span class="warnmsg">Up to 30 days — start moved to ${dL(f)}</span>`;
      setTimeout(()=>{FROM=f;TO=t;syncControls();},2200);} }
  FROM=f;TO=t;syncControls();render();
}
document.querySelectorAll('.seg button[data-preset]').forEach(b=>b.onclick=()=>
  setRange(addDays(C.maxDate,-(+b.dataset.preset-1)),C.maxDate,true));
eF.onchange=()=>setRange(eF.value||C.minDate,TO);
eT.onchange=()=>setRange(FROM,eT.value||C.maxDate);
document.getElementById('theme').onclick=()=>{
  const dk=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=dk?'light':'dark';
  document.getElementById('theme').textContent=dk?'☾':'☀';};

/* ---------- load data.json ---------- */
function init(data){
  C=data; FROM=C.minDate; TO=C.maxDate;
  eF.min=eT.min=C.minDate; eF.max=eT.max=C.maxDate;
  document.querySelector('.ctrls').style.visibility='visible';
  syncControls(); render();
}
function loadFail(why){
  document.getElementById('app').innerHTML=
    `<div class="loadmsg"><h2>Report data could not be loaded</h2>
      <p>${esc(why)}</p>
      <p class="hint">If you are opening this file directly from your computer, browsers block it from reading
        <code>data.json</code> for security reasons. Open the report from its web address instead, or contact
        whoever sent you this link.</p></div>`;
}
document.getElementById('app').innerHTML=
  `<div class="loadmsg"><div class="spin"></div><p>Loading the latest figures&hellip;</p></div>`;
fetch('data.json?v='+Date.now(),{cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error('The server returned '+r.status+' for data.json'); return r.json(); })
  .then(d=>init(d))
  .catch(e=>loadFail(String(e && e.message ? e.message : e)));
</script>
</body>
